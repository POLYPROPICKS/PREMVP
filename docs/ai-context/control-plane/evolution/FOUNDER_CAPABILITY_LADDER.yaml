      "level": 7,
      "id": "CONTROLLED_SELF_IMPROVEMENT",
      "title": "Controlled self-improvement",
      "plain_ru": "Умение позволять системе улучшать саму себя, не теряя контроль над приоритетами и деньгами.",
      "evidence_examples": ["an automation promoted through a gate with a stop condition", "an automation stopped by its own stop condition"],
      "status": "NOT_ASSESSED"
