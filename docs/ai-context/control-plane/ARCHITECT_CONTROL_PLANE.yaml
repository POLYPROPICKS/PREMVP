    { "path": "docs/ai-context/PROMPT__PROTOCOL.md", "status": "NOT_TRACKED_IN_ORIGIN_MAIN", "authoritative_for_current_state": false, "note": "A file of this name exists only in an untracked Local Windows worktree. Its authority is unresolved and it MUST NOT be cited as authority. The canonical prompt contract is docs/ai-context/control-plane/PROMPT__PROTOCOL.md." },
