{
  "schema_version": "1.0",
  "policy_version": "1.0.0",
  "updated_at": "2026-08-03T00:00:00Z",
  "_format_note": "JSON-compatible YAML 1.2 subset. Every .yaml file in this directory MUST also parse with JSON.parse. Do not introduce block YAML syntax here.",

  "project": {
    "name": "PolyProPicks",
    "control_plane_name": "PolyProPicks — Architect Control Plane",
    "primary_repository": "POLYPROPICKS/PREMVP",
    "production_url": "https://polypropicks.com"
  },

  "architect_interface": {
    "default": "STANDARD_CHAT",
    "default_surface": "ChatGPT Project — Standard Chat",
    "project_name": "PolyProPicks — Architect Control Plane",
    "memory_mode": "PROJECT_ONLY",
    "work_mode": "ESCALATION_ONLY",
    "work_mode_rationale": "Work is high cost and is not the default architect runtime. It may only be used for an explicitly scoped, Founder-authorized deep research or long-horizon architecture escalation.",
    "architect_subagents": "NOT_IN_PHASE_1",
    "mandatory_stages": [
      "STATE_LOAD",
      "SOURCE_AUTHORITY_CHECK",
      "TASK_CLASSIFICATION",
      "RISK_CLASSIFICATION",
      "EXECUTOR_ROUTING",
      "PROMPT_COMPILATION",
      "PROMPT_CONTRACT_CHECK",
      "FINAL_OUTPUT"
    ]
  },

  "operator_mode": {
    "default": "MOBILE_REMOTE",
    "allowed": ["MOBILE_REMOTE", "DESKTOP_BROWSER", "DESKTOP_TERMINAL"],
    "assumption": "The Founder may be operating only through the ChatGPT iOS application. Every normal flow must be completable from a phone."
  },

  "source_authority": {
    "_note": "Two separate precedence trees. Do NOT collapse them into one global list.",
    "runtime_facts": [
      { "rank": 1, "source": "LIVE_RUNTIME_EVIDENCE", "description": "Current live Git / command / runtime output produced in this session." },
      { "rank": 2, "source": "CURRENT_STATE_ENTRY", "description": "Accepted CURRENT_STATE.yaml entry with valid freshness and attached proof." },
      { "rank": 3, "source": "TRACKED_DOCUMENTATION", "description": "Current tracked documentation in the repository." },
      { "rank": 4, "source": "EXECUTOR_SELF_REPORT", "description": "Executor claim without independent verification. SUPPORTED, never PROVEN." },
      { "rank": 5, "source": "CHAT_MEMORY", "description": "Chat memory or history. Lowest authority." }
    ],
    "runtime_facts_rule": "A Founder statement does not by itself prove a runtime PASS. Founder statements enter as FOUNDER_ACCEPTED_EXTERNAL_* evidence classes and never as PROVEN_IN_RUNTIME.",
    "product_decisions": [
      { "rank": 1, "source": "CURRENT_FOUNDER_DECISION", "description": "Current explicit Founder decision." },
      { "rank": 2, "source": "CONTROL_PLANE_POLICY", "description": "Accepted Architect Control Plane policy (this file)." },
      { "rank": 3, "source": "LOCKED_PRODUCT_DECISIONS", "description": "docs/ai-context/04_PRODUCT_DECISIONS_LOCKED.md" },
      { "rank": 4, "source": "HISTORICAL_CHECKPOINT", "description": "Prior accepted checkpoint or milestone record." },
      { "rank": 5, "source": "CHAT_MEMORY", "description": "Chat memory or history. Lowest authority." }
    ]
  },

  "canonical_artifacts": {
    "root": "docs/ai-context/control-plane",
    "items": [
      { "id": "control_plane_policy", "path": "docs/ai-context/control-plane/ARCHITECT_CONTROL_PLANE.yaml", "role": "POLICY", "authoritative_for": "control plane policy, interface, boundaries" },
      { "id": "current_state", "path": "docs/ai-context/control-plane/CURRENT_STATE.yaml", "role": "CURRENT_STATE", "authoritative_for": "current operational state" },
      { "id": "capability_matrix", "path": "docs/ai-context/control-plane/CAPABILITY_MATRIX.yaml", "role": "CAPABILITY", "authoritative_for": "execution target capabilities and environment paths" },
      { "id": "routing_and_pipelines", "path": "docs/ai-context/control-plane/ROUTING_AND_PIPELINES.yaml", "role": "ROUTING", "authoritative_for": "task/risk classes, executor and reviewer selection" },
      { "id": "agent_registry", "path": "docs/ai-context/control-plane/AGENT_REGISTRY.yaml", "role": "REGISTRY", "authoritative_for": "agents, skills, commands, hooks, scripts, gates, policies" },
      { "id": "prompt_protocol", "path": "docs/ai-context/control-plane/PROMPT__PROTOCOL.md", "role": "PROMPT_CONTRACT", "authoritative_for": "executor prompt structure" },
      { "id": "completion_envelope_schema", "path": "docs/ai-context/control-plane/COMPLETION_ENVELOPE.schema.json", "role": "COMPLETION_CONTRACT", "authoritative_for": "executor result structure" },
      { "id": "evidence_ledger", "path": "docs/ai-context/control-plane/EVIDENCE_LEDGER.md", "role": "HISTORICAL_LEDGER", "authoritative_for": "history only — NEVER current state" },
      { "id": "chatgpt_project_setup", "path": "docs/ai-context/control-plane/CHATGPT_PROJECT_SETUP.md", "role": "FOUNDER_SETUP", "authoritative_for": "Phase 2 project setup and Phase 3 shadow plan" },
      { "id": "architect_snapshot", "path": "docs/ai-context/control-plane/ARCHITECT_SNAPSHOT.md", "role": "GENERATED_SNAPSHOT", "authoritative_for": "nothing — generated view of the canonical files" }
    ],
    "single_current_state_authority": {
      "artifact": "docs/ai-context/control-plane/CURRENT_STATE.yaml",
      "rule": "CURRENT_STATE.yaml is the ONLY current operational state artifact. Any other document describing current state is historical or descriptive and cannot override it."
    },
    "evidence_ledger_authority": {
      "artifact": "docs/ai-context/control-plane/EVIDENCE_LEDGER.md",
      "rule": "EVIDENCE_LEDGER.md is append-only history. It is NEVER authoritative for current state."
    },
    "generated_artifacts": [
      { "path": "docs/ai-context/control-plane/ARCHITECT_SNAPSHOT.md", "generator": "scripts/control-plane/generate-architect-snapshot.mjs", "deterministic": true }
    ]
  },

  "execution_targets": {
    "matrix_ref": "docs/ai-context/control-plane/CAPABILITY_MATRIX.yaml",
    "registered": ["claude_code_cloud", "local_codex_windows", "ireland_local"],
    "rule": "Environment-specific paths, repositories and shell assumptions MUST be read from CAPABILITY_MATRIX.yaml. Do not hardcode Windows as the only execution environment."
  },

  "repository_boundaries": {
    "premvp": {
      "repository": "POLYPROPICKS/PREMVP",
      "execution_targets": ["claude_code_cloud", "local_codex_windows"]
    },
    "ireland": {
      "repository": "UNPROVEN_REMOTE_IDENTITY",
      "execution_targets": ["ireland_local"],
      "status": "PROTECTED_BOUNDARY_ONLY",
      "access_in_control_plane_phase_1_2": false
    },
    "mixing_rule": "PREMVP and Ireland implementation prompts CANNOT be mixed. One executor prompt targets exactly one repository boundary. A prompt that would touch both must be split, or PROMPT_GATE_BLOCKED.",
    "cross_repository_implementation": "FORBIDDEN_WITHOUT_SEPARATE_AUTHORIZATION"
  },

  "mobile_first_policy": {
    "default_operator_mode": "MOBILE_REMOTE",
    "normal_flow_must_not_require": ["WINDOWS_CMD", "POWERSHELL", "SQL", "SSH", "SUPABASE_UI_QUERY", "CWD_SELECTION", "MANUAL_REPOSITORY_SELECTION", "SECRET_COPY"],
    "break_glass": {
      "id": "BREAK_GLASS_OPERATOR_ACTION",
      "allowed_when": "It has been explicitly proven that no registered executor in CAPABILITY_MATRIX.yaml can perform the action.",
      "requires": ["explicit label BREAK_GLASS_OPERATOR_ACTION", "explicit proof of executor inability", "explicit Founder authorization"]
    }
  },

  "founder_action_budget": {
    "preferred": 0,
    "maximum_normal": 1,
    "unit": "one clear tap OR one copy/paste action",
    "per_milestone_maximum": "one copy/paste down and one result up",
    "overrun_behavior": "STOP and re-contract",
    "scope": "PER_TASK",
    "exemptions": [
      "One-time provisioning sequences performed once per environment — notably the Phase 2 ChatGPT Project setup in CHATGPT_PROJECT_SETUP.md — are outside the per-task budget. They must still be completable from a phone in one bounded UI sequence with no shell, SQL or secret handling."
    ]
  },

  "global_stop_conditions": [
    "CONTROL_PLANE_WRONG_REPOSITORY — checkout is not the repository named in the prompt",
    "CONTROL_PLANE_DIRTY_WORKTREE — unexpected dirty state",
    "CONTROL_PLANE_SCOPE_EXPANSION_REQUIRED — a file outside ALLOWED FILES must change",
    "PROMPT_GATE_BLOCKED — required prompt section, capability, evidence or routing is missing or contradictory",
    "STATE_STALE — CURRENT_STATE.yaml exceeds its freshness window and cannot be re-proven",
    "CAPABILITY_NOT_PROVEN — routing requires a capability whose verdict is not PROVEN",
    "REVIEWER_RECEIPT_MISSING — a mandatory reviewer produced no valid receipt",
    "REPOSITORY_BOUNDARY_MIXED — a single prompt targets both PREMVP and Ireland",
    "SECRETS_REQUIRED — env/secret values would have to be read or printed"
  ],

  "stale_state_behavior": {
    "mode": "FAIL_CLOSED",
    "rule": "When CURRENT_STATE.yaml is stale, missing, or its origin_main_sha does not match live origin/main, the architect MUST return PROMPT_GATE_BLOCKED and request a bounded read-only refresh task. It must NOT guess, extrapolate, or fall back to chat memory or legacy state documents."
  },

  "prohibited_founder_actions": [
    "Running Windows CMD or PowerShell in the normal flow",
    "Writing or running SQL",
    "Opening the Supabase UI to answer a state question",
    "SSH into any host",
    "Locating or typing a working directory",
    "Manually selecting a repository for an executor",
    "Copying secret or token values",
    "Manually editing source files",
    "Reconciling duplicate instruction documents by hand"
  ],

  "superseded_or_legacy_sources": [
