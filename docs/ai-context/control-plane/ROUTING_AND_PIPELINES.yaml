  "minimum_agent_policy": {
    "rule": "Invoke only the agents required by the classified risk class. There is NO all-agent policy. Invoking an unnecessary reviewer is a routing defect and is recorded as token overhead in shadow metrics.",
    "all_agent_invocation": false
  },

  "executor_parity_policy": {
    "rule": "For PREMVP, claude_code_cloud and local_codex_windows are equally authorized execution targets for R0_READ_ONLY through R4_CONTUR_PRODUCTION_BOUNDARY, subject to the same reviewer and capability-evidence requirements per risk class. Neither executor is an execution dependency of the other — routing MUST NOT route one executor through the other. A capability may be authorized (see CAPABILITY_MATRIX.yaml authorization_vs_evidence_policy) for a given executor while its evidence verdict remains NOT_PROVEN; routing eligibility on a risk class requires only that at least one eligible executor holds a PROVEN verdict for each required capability, and the selected executor may prove its own instance of that capability via the same-run capability bootstrap rule before continuing. Ireland and R5 remain fail-closed and are unaffected by this parity."
  },

  "task_classes": [
    { "id": "READ_ONLY_EVIDENCE", "description": "Gather evidence, no writes.", "default_risk_class": "R0_READ_ONLY" },
    { "id": "DOCS_CONTEXT", "description": "Documentation and control-plane artifacts.", "default_risk_class": "R1_BOUNDED_CODE" },
    { "id": "BOUNDED_CODE_PATCH", "description": "Narrow code patch inside an explicit allowed-file list.", "default_risk_class": "R1_BOUNDED_CODE" },
    { "id": "ARCHITECTURE_OR_ROADMAP", "description": "Control-plane, routing, roadmap or authority change.", "default_risk_class": "R2_ARCHITECTURE_OR_ROADMAP" },
    { "id": "ML_MODEL_CHANGE", "description": "Weather / scoring / model behavior change.", "default_risk_class": "R3_WEATHER_MODEL_CHANGE" },
    { "id": "LIVE_RUNTIME_OPERATION", "description": "Touching a live runtime, deploy, or production data.", "default_risk_class": "R4_CONTUR_PRODUCTION_BOUNDARY" },
    { "id": "CROSS_REPO_OR_LIVE_MONEY", "description": "Spanning PREMVP and Ireland, or moving real money.", "default_risk_class": "R5_CROSS_REPO_OR_LIVE_MONEY" }
