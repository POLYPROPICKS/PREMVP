  "authorization_vs_evidence_policy": {
    "rule": "Every capability entry carries two independent facts: `authorized` (policy permission, set by Founder/control-plane decision) and `verdict` (live runtime evidence). Authorization alone never produces a runtime PASS — a capability may be authorized while its verdict is NOT_PROVEN. NOT_PROVEN means untested, not forbidden; NOT_AVAILABLE means the runtime genuinely lacks the surface. `authorized: false` blocks routing regardless of verdict.",
    "same_run_capability_bootstrap": {
      "rule": "When a required capability is authorized (authorized: true) but its verdict is NOT_PROVEN, the selected executor MUST first attempt one bounded, safe, evidence-producing probe of that capability inside the same task, then continue automatically when the probe succeeds and record the resulting verdict as a capability_changes entry in its completion envelope.",
      "constraints": [
        "no separate Founder confirmation required",
        "no switching to a different executor",
        "presence of credentials or files is never itself proof",
        "no destructive probe",
        "a database-write probe must be reversible, bounded, and avoid business tables when a probe surface exists",
        "an already-authorized R4 mutation may itself supply capability evidence when rollback and evidence requirements are explicit",
        "a failed, unavailable, or unsafe probe fails closed with the exact blocker named",
        "capability_changes entries are proposals recorded by the executor; they are never self-accepted as CAPABILITY_MATRIX.yaml state by the same run — a subsequent governance task reconciles CAPABILITY_MATRIX.yaml from accepted evidence"
      ]
    }
  },

