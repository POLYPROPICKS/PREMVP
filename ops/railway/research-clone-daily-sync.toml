# Service-scoped Railway config for the `research-clone-daily-sync` service ONLY.
#
# This file is intentionally NOT named `railway.toml` / `railway.json` and does
# not live at the repository root, so Railway does not auto-discover it. It takes
# effect only for the single service whose Settings > Config-as-code path is set
# to `ops/railway/research-clone-daily-sync.toml`. No sibling service (PREMVP
# web, signal-resolve-cron, contur3-* crons, ops-report-email-cron, etc.) reads
# it, so landing it on `main` cannot change any other service's start command.
#
# Activation (pointing the service at this path + first bounded run) is handled
# by the follow-up mission RESEARCH_CLONE_RUNTIME_ACTIVATE_VERIFY_V1.

[build]
buildCommand = "npm ci --ignore-scripts"

[deploy]
# The third step is the DIRECT_MODEL_READY_RESEARCH_PATH_V1 materializer
# (scripts/modeling/materialize-research-model-ready.ts). Reuses this same
# service's existing production-read + research-clone credentials; adds no
# new service, scheduler, or credential system. With no --start/--end/--dates
# it defaults to a bounded "missing/recent" window (see
# resolveMissingRecentDates) — never an unbounded backfill. It never writes
# research_model_economics; the pre-existing research-clone:model-ready step
# is unchanged and keeps that responsibility.
#
# UNBLOCK_DIRECT_MODEL_READY_RUNTIME_V1: the first two steps stay chained with
# `&&` (unchanged legacy gating — scripts/research-clone-daily-sync.ts sets
# process.exitCode=75 on a resumable partial sync specifically because "the
# scheduled command uses &&, so a resumable partial sync safely suppresses
# model materialization" for the LEGACY research-clone:model-ready economics
# step). The direct model-ready path is the analytics authority and reads
# straight from the research clone tables in bounded, already-synced slices —
# it has no dependency on that run's sync/legacy-pipeline exit code, so it is
# separated with `;` and always attempts to run, even when the legacy sync or
# legacy pipeline step fails or is still catching up.
startCommand = "npm run research-clone:sync && npm run research-clone:model-ready; npm run research-clone:model-ready-direct"
cronSchedule = "0 2 * * *"
restartPolicyType = "NEVER"
